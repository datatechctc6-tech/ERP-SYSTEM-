<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Database Setup</h2>
    <form id="setup-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Host</label>
        <input type="text" id="host" value="localhost" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Port</label>
        <input type="number" id="port" value="3306" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="user" value="root" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Database Name</label>
        <input type="text" id="database" value="erpdatatemp" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      
      <div id="error-message" class="text-red-500 text-sm hidden mt-2 bg-red-50 p-2 rounded"></div>
      
      <button type="submit" id="submit-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
        Connect & Save
      </button>
    </form>
  </div>
  
  <script>
    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const errorDiv = document.getElementById('error-message');
      
      btn.textContent = 'Connecting...';
      btn.disabled = true;
      errorDiv.classList.add('hidden');
      errorDiv.textContent = '';
      
      const config = {
        host: document.getElementById('host').value,
        port: parseInt(document.getElementById('port').value, 10),
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        database: document.getElementById('database').value
      };
      
      try {
        const response = await window.electronAPI.saveConfig(config);
        if (response.success) {
          btn.textContent = 'Success! Starting system...';
        } else {
          throw new Error(response.error);
        }
      } catch (err) {
        errorDiv.textContent = err.message || 'Connection failed';
        errorDiv.classList.remove('hidden');
        btn.textContent = 'Connect & Save';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
